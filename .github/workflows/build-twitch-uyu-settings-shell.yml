name: Build Kizu

on:
  push:
    branches:
      - twitch-uyu-settings-shell
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Kizu build files
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Checkout uyu base
        uses: actions/checkout@v4
        with:
          repository: bakwudo/uyu
          ref: main
          path: uyu

      - name: Checkout emote donor
        uses: actions/checkout@v4
        with:
          repository: arandomhooman/hoomans-morphe-patches
          ref: main
          path: hooman

      - name: Apply Kizu customizations
        run: python3 twitch-build/apply_kizu.py

      - name: Build Kizu MPP
        working-directory: uyu
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - name: Collect Kizu MPP
        run: |
          mkdir -p out
          cp uyu/patches/build/libs/kizu-0.2.3.mpp out/
          sha256sum out/kizu-0.2.3.mpp

      - name: Upload Kizu MPP
        uses: actions/upload-artifact@v4
        with:
          name: kizu-v0.2.3-mpp
          path: out/kizu-0.2.3.mpp
          if-no-files-found: error
