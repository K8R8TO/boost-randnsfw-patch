name: Auto Release on Approval

on:
  push:
    branches: [ twitch-uyu-settings-shell ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build patches
        run: |
          ./gradlew buildAndroid --no-daemon || ./gradlew build --no-daemon
          mkdir -p out
          find . -name "*.mpp" -not -path "*/out/*" -exec cp {} out/ \;
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload mpp
        uses: actions/upload-artifact@v4
        with:
          name: kizu-mpp
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: approve-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kizu-mpp
          path: out
      - name: Publish release and update patches-bundle.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.4.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          MPP=$(ls out/*.mpp | head -n 1)
          cp "$MPP" "kizu-${VERSION}.mpp"
          gh release create "$TAG" "kizu-${VERSION}.mpp" --title "Kizu Twitch ${VERSION}" --notes "Auto-released after manual approval"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kizu-${VERSION}.mpp"
          jq -n --arg v "$VERSION" --arg u "$URL" --arg c "$(date -u +%Y-%m-%dT%H:%M:%S)" '{created_at:$c, description:"PurpleTV features for Twitch", download_url:$u, signature_download_url:"", version:$v}' > patches-bundle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore: release ${VERSION} [skip ci]"
          git push
